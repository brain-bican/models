name: reusable-generate-yaml

on:
  workflow_call:
    inputs:
      model:
        description: 'model name'
        required: true
        type: string

jobs:
  generate_yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"

      - name: Install the required python packages
        run: |
          python -m pip install .[test]
          pip install linkml=="1.11.1" # specify the older version of linkml
          pip install git+https://github.com/brain-bican/bkbit.git

      - name: Other installations
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      # Check if download-dir exists; if not, create it
      - name: Check if download-dir exists
        run: |
          if [ ! -d "linkml-schema/source_${{ inputs.model }}/gsheet_output" ]; then
            echo "Directory does not exist. Making directory"
            mkdir -p linkml-schema/source_${{ inputs.model }}/gsheet_output
          fi
      
      # Check if gsheet.yaml exists
      - name: Check if gsheet.yaml exists
        run: |
          if [ ! -f "linkml-schema/source_${{ inputs.model }}/gsheet.yaml" ]; then
            echo "gsheet.yaml does not exist. Exiting"
            exit 1
          fi

      # Generate yaml model
      - name: Generate yaml model
        run: |
          cd linkml-schema
          # Invoke the converter module directly rather than the `bkbit` console
          # script. bkbit/cli.py eagerly imports HMBA_annotation_translator ->
          # bkbit.models.bke_taxonomy, whose SpatialProportions class has a slot
          # literally named `str`; that shadows the builtin, so `Optional[str]`
          # on a later field in the class cannot be evaluated and *every* bkbit
          # command dies at import. schema2model has no dependency on
          # bke_taxonomy, so going straight to the module sidesteps it entirely
          # and is not sensitive to the pydantic/Python version combination.
          # Real fix (rename the slot): brain-bican/models#228
          python -m bkbit.model_converters.sheets_converter -o ${{ inputs.model }}.yaml --gsheet --gsheet-download-dir source_${{ inputs.model }}/gsheet_output  source_${{ inputs.model }}/gsheet.yaml  --no-inlined
          cd ..

      # Generate unique branch name 
      - name: Generate unique branch name
        run: |
          BRANCH_NAME="autogenerated-yaml-$(date +%Y%m%d%H%M%S)"
          echo "Branch created: $BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
  
      # Create a pull request
      - name: Create a Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Generate new version of the linkml model for ${{ inputs.model }}"
          branch: ${{ env.BRANCH_NAME }}
          title: "Auto PR: ${{ inputs.model }}.yaml generated from google spreadsheets using schemasheets"
          body: "This PR adds an autogenerated ${{ inputs.model }}.yaml file."
          base: main
