name: generating documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild after the generate workflows commit regenerated diagrams to main
  # (their commits use GITHUB_TOKEN, so they don't trigger the push event above).
  workflow_run:
    workflows:
      - generating other formats for anatomical_structure
      - generating other formats for assertion_evidence
      - generating other formats for bke_taxonomy
      - generating other formats for cell_taxonomy
      - generating other formats for genome_annotation
      - generating other formats for library_generation
    types: [completed]
    branches: [main]
  
permissions:
  contents: write

# Only the latest pending docs build matters, so intermediate ones can be dropped.
concurrency:
  group: generate-docs
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.x"

      - name: Install the required python packages
        run: python -m pip install .[docs]

      - name: Other installations
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      - name: Create local docs
        run: |
          mkdir docs
          cp -r src/docs/* docs/
          touch docs/.nojekyll
          cp erdiagram-autogen/anatomical_structure.md docs/anatomical_structure.md
          cp erdiagram-autogen/genome_annotation.md docs/genome_annotation.md
          cp erdiagram-autogen/library_generation.md docs/library_generation.md
          cp erdiagram-autogen/assertion_evidence.md docs/assertion_evidence.md
          cp erdiagram-autogen/bke_taxonomy.md docs/bke_taxonomy.md
          cp erdiagram-autogen/cell_taxonomy.md docs/cell_taxonomy.md
          gen-doc -d docs linkml-schema/library_generation.yaml
          mv docs/index.md docs/index_library_generation.md
          gen-doc -d docs linkml-schema/anatomical_structure.yaml
          mv docs/index.md docs/index_anatomical_structure.md
          gen-doc -d docs linkml-schema/genome_annotation.yaml
          mv docs/index.md docs/index_genome_annotation.md
          gen-doc -d docs linkml-schema/assertion_evidence.yaml
          mv docs/index.md docs/index_assertion_evidence.md
          gen-doc -d docs linkml-schema/bke_taxonomy.yaml
          mv docs/index.md docs/index_bke_taxonomy.md
          gen-doc -d docs linkml-schema/cell_taxonomy.yaml
          mv docs/index.md docs/index_cell_taxonomy.md
          mv docs/index_main.md docs/index.md
          


      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
