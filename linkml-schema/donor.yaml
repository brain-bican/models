  tissue_collection_state:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      autopsy:
        description: A postmortem examination of the body that includes an examination
          of the internal organs and structures after dissection to determine the
          cause of death and the nature of pathological changes.
        meaning: GSSO:006664
      surgery:
        description: "Surgery is a medical procedure that uses operative manual and\
          \ instrumental techniques on a patient to investigate and/or treat a pathological\
          \ condition such as disease or injury, to help improve bodily function or\
          \ appearance. The key difference between a surgery and a general procedure\
          \ is the need for an incision. Making an incision, or cutting into the skin\
          \ to gain access to the body\u2019s deeper tissues or organs, is a defining\
          \ characteristic of surgery."
        meaning: OAE:0000067
  tissue:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      adipose:
        description: Portion of connective tissue composed of adipocytes enmeshed
          in areolar tissue.
        meaning: UBERON:0001013
      adrenal:
        description: Tissue that is part of some adrenal gland.
        meaning: UBERON:0018303
      anus:
        description: 'Orifice at the opposite end of an animal''s digestive tract
          from the mouth. Its function is to expel feces, unwanted semi-solid matter
          produced during digestion, which, depending on the type of animal, may be
          one or more of: matter which the animal cannot digest, such as bones; food
          material after all the nutrients have been extracted, for example cellulose
          or lignin; ingested matter which would be toxic if it remained in the digestive
          tract; and dead or excess gut bacteria and other endosymbionts.'
        meaning: UBERON:0001245
      aorta:
        description: The main trunk of the systemic arterial system that carries blood
          from the heart to all the organs and other structures of the body, bringing
          oxygenated blood to all parts of the body in the systemic circulation.
        meaning: UBERON:0000947
      appendix:
        description: A blind-ended tube connected to the cecum, from which it develops
          embryologically.
        meaning: UBERON:0001154
      artery:
        description: An epithelial tube or tree of tibes that transports blood away
          from the heart.
        meaning: UBERON:0001637
      ascending colon:
        description: Section of colon which is distal to the cecum and proximal to
          the transversecolon.
        meaning: UBERON:0001156
      astrocytes:
        description: A class of large neuroglial (macroglial) cells in the central
          nervous system - the largest and most numerous neuroglial cells in the brain
          and spinal cord. Astrocytes (from 'star' cells) are irregularly shaped with
          many long processes, including those with 'end feet' which form the glial
          (limiting) membrane and directly and indirectly contribute to the blood-brain
          barrier. They regulate the extracellular ionic and chemical environment,
          and 'reactive astrocytes' (along with microglia) respond to injury. Astrocytes
          are reportedly CD68-negative, CD121a-positive, CD184-positive, CD192-positive,
          CRF-positive, EGFR-positive, GFAP-positive, GLUT1-positive, MBP-negative,
          and NGFR-positive.
        meaning: CL:0000127
      bladder:
        description: Distensible musculomembranous organ situated in the anterior
          part of the pelvic cavity in which urine collects before excretion.
        meaning: UBERON:0001255
      bone rib:
        description: An intersegmental rod-shaped bone that forms in the peritoneal
          membrane and attach to the vertebral parapophyses.
        meaning: UBERON:0002228
      breast:
        description: The upper ventral region of the torso of an organism.
        meaning: UBERON:0000310
      bronchus:
        description: The upper conducting airways of the lung; these airways arise
          from the terminus of the trachea.
        meaning: UBERON:0002185
      cervical spinal cord:
        description: A spinal cord segment that adjacent_to a cervical region.
        meaning: UBERON:0002726
      colon ascending:
        description: Section of colon which is distal to the cecum and proximal to
          the transversecolon.
        meaning: UBERON:0001156
      colon descending:
        description: The portion of the colon between the left colic flexure and the
          sigmoid colon at the pelvic brim; the portion of the descending colon lying
          in the left iliac fossa is sometimes called the iliac colon.
        meaning: UBERON:0001158
      CSF:
        description: A clear, colorless, bodily fluid, that occupies the subarachnoid
          space and the ventricular system around and inside the brain and spinal
          cord.
        meaning: UBERON:0001359
      DRG cervical:
        description: A group of nerve cell bodies located on the dorsal spinal roots
          within the vertebral column at the level of the cervical vertebrae.
        meaning: UBERON:0002834
      DRG sacral:
        description: A group of nerve cell bodies located on the dorsal spinal roots
          within the vertebral column at the level of the sacral vertebrae.
        meaning: UBERON:0002837
      DRG thoracic:
        description: A dorsal root ganglion that is part of a thorax.
        meaning: UBERON:0002835
      diaphragm:
        description: A thin musculomebranous barrier that separates the abdominal
          and thoracic cavities. Often used for breathing control.
        meaning: UBERON:0001103
      DNA:
        description: A long linear double-stranded polymer formed from nucleotides
          attached to a deoxyribose backbone and found in the nucleus of a cell; associated
          with the transmission of genetic information.
        meaning: NCIT:C449
      DRG lumbar:
        description: The group of nerve cell bodies located on the dorsal spinal roots
          within the vertebral column at the level of the lumbar vertebrae.
        meaning: UBERON:0002836
      duodenum:
        description: The first part of the small intestine. At the junction of the
          stomach and the duodenum the alimentary canal is inflected. The duodenum
          first goes anteriorly for a short distance, turns dorsally, and eventually
          caudally, thus it is a U-shaped structure with two horizontal sections (a
          ventral and a dorsal one).
        meaning: UBERON:0002114
      esophagus:
        description: Tube that connects the pharynx to the stomach. In mammals, the
          oesophagus connects the buccal cavity with the stomach. The stratified squamous
          non-keratinised epithelium lining the buccal cavity is continued through
          the pharynx down into the oesophagus. The lowest part of the oesophagus
          (ca. 2 cm) is lined with gastric mucosa and covered by peritoneum. The main
          body of the oesophagus is lined with small, simple mucous glands. Each gland
          opens into the lumen by a long duct which pierces the muscularis mucosae
          (Wilson and Washington, 1989). A sphincter is situated at the point where
          the oesophagus enters the stomach to prevent gastro-oesophageal reflux,
          i.e. to prevent acidic gastric contents from reaching stratified epithelia
          of the oesophagus, where they can cause inflammation and irritation (Wilson
          and Washington, 1989; Brown et al., 1993).
        meaning: UBERON:0001043
      eyes:
        description: An organ that detects light.
        meaning: UBERON:0000970
      fallopian tube:
        description: Initial section of the oviduct through which the ova pass from
          the ovary to the uterus.
        meaning: UBERON:0003889
      fibroblasts:
        description: A connective tissue cell which secretes an extracellular matrix
          rich in collagen and other macromolecules. Flattened and irregular in outline
          with branching processes; appear fusiform or spindle-shaped. These cells
          may be vimentin-positive, fibronectin-positive, fsp1-positive, MMP-1-positive,
          collagen I-positive, collagen III-positive, and alpha-SMA-negative.
        meaning: CL:0000057
      gallbladder:
        description: An organ that aids digestion and stores bile produced by the
          liver. Rats do not have a gallbladder, but produce bile. The bile flows
          directly from the liver through the (hepatic) bile duct into the small intestine
          (Hebel and Stromberg, 1988).
        meaning: UBERON:0002110
      hair:
        description: A filament, mostly protein, that grows from follicles found in
          the dermis.
        meaning: UBERON:0001037
      heart:
        description: A myogenic muscular circulatory organ found in the vertebrate
          cardiovascular system composed of chambers of cardiac muscle. It is the
          primary circulatory organ. Taxon notes:" the ascidian tube-like heart lacks
          chambers....The ascidian heart is formed after metamorphosis as a simple
          tube-like structure with a single-layered myoepithelium that is continuous
          with a single-layered pericar- dial wall. It lacks chambers and endocardium....
          The innovation of the chambered heart was a key event in vertebrate evolution,
          because the chambered heart generates one-way blood flow with high pressure,
          a critical requirement for the efficient blood supply of large-body vertebrates...
          all extant vertebrates have hearts with two or more chambers (Moorman and
          Christoffels 2003)" DOI:10.1101/gad.1485706
        meaning: UBERON:0000948
      ileum:
        description: The portion of the small intestine that extends from the jejunum
          to the colon.
        meaning: UBERON:0002116
      jejunum:
        description: The portion of the small intestine that extends from the duodenum
          to the ileum.
        meaning: UBERON:0002115
      kidney:
        description: A paired organ of the urinary tract that produces urine and maintains
          bodily fluid homeostasis, blood pressure, pH levels, red blood cell production
          and skeleton mineralization.
        meaning: UBERON:0002113
      liver:
        description: An exocrine gland which secretes bile and functions in metabolism
          of protein and carbohydrate and fat, synthesizes substances involved in
          the clotting of the blood, synthesizes vitamin A, detoxifies poisonous substances,
          stores glycogen, and breaks down worn-out erythrocytes.
        meaning: UBERON:0002107
      long bone:
        description: A long bone is a bone that has a shaft and 2 ends and is longer
          than it is wide. Long bones have a thick outside layer of compact bone and
          an inner medullary cavity containing bone marrow. The ends of a long bone
          contain spongy bone and an epiphyseal plate or line depending on the stage
          of development. The epiphyseal plate is a hyaline cartilage, where new bone
          growth takes place, lengthening the bone prior to adulthood. Bone lengthening
          ceases when this cartilage is lost, leaving a remnant referred to as an
          epiphyseal line.
        meaning: UBERON:0002495
      lumbar spinal cord:
        meaning: UBERON:0002792
      lung:
        description: Respiration organ that develops as an outpocketing of the esophagus.
        meaning: UBERON:0002048
      lymph node:
        description: Any of the rounded masses of lymphoid tissue that are surrounded
          by a capsule of connective tissue, are distributed along the lymphatic vessels,
          and contain numerous lymphocytes which filter the flow of lymph.
        meaning: UBERON:0000029
      middle ear bone:
        description: One of 3 small bones contained within the middle ear space and
          serve to transmit sounds from the air to the fluid-filled labyrinth. The
          absence of the auditory ossicles would constitute a moderate-to-severe hearing
          loss. The term 'ossicles' literally means 'tiny bones' and commonly refers
          to the auditory ossicles, though the term may refer to any small bone throughout
          the body.
        meaning: UBERON:0001686
      nail:
        description: A horn-like keratin structure covering the dorsal aspect of the
          terminal phalanges of fingers and toes.
        meaning: UBERON:0001705
      ovary:
        description: The gonad of a female organism which contains germ cells.
        meaning: UBERON:0000992
      pancreas:
        description: An endoderm derived structure that produces precursors of digestive
          enzymes and blood glucose regulating hormones.
        meaning: UBERON:0001264
      peripheral nerve:
        description: An enclosed, cable-like bundle of axons in the peripheral nervous
          system originating in a nerve root in the central nervous system (or a condensed
          nervous structure) connecting with peripheral structures.
        meaning: UBERON:0001021
      pineal:
        description: A midline, cone like structure located in the dorso-caudal roof
          of the 3rd ventricle, attached by peduncles to the habenular and posterior
          commissures. The stalk contains nerve fibers, blood vessels, connective
          tissue and parenchymal cells (Paxinos, The Rat Central Nervous System, 2nd
          ed, pg 399).
        meaning: UBERON:0001905
      pituitary:
        description: The pituitary gland is an endocrine gland that secretes hormones
          that regulate many other glands.
        meaning: UBERON:0000007
      placenta:
        description: Organ of metabolic interchange between fetus and mother, partly
          of embryonic origin and partly of maternal origin[GO]. The fetal portion
          of the placenta is known as the villous chorion. The maternal portion is
          known as the decidua basalis. The two portions are held together by anchoring
          villi that are anchored to the decidua basalis by the cytotrophoblastic
          shell. Marsupials possess only a rudimentary yolk-type placenta, with reduced
          nutrient and oxygen exchanging capabilities.
        meaning: UBERON:0001987
      plasma:
        description: The liquid component of blood, in which erythrocytes are suspended.
        meaning: UBERON:0001969
      prostate:
        description: The prostate gland is a partly muscular, partly glandular body
          that is situated near the base of the mammalian male urethra and secretes
          an alkaline viscid fluid which is a major constituent of the ejaculatory
          fluid.
        meaning: UBERON:0002367
      psoas muscle:
        description: A powerful flexor of the thigh at the hip joint (psoas major)
          and a weak flexor of the trunk and lumbar spinal column (psoas minor). Psoas
          is derived from the Greek 'psoa', the plural meaning 'muscles of the loin'.
          It is a common site of infection manifesting as abscess (PSOAS ABSCESS).
          The psoas muscles and their fibers are also used frequently in experiments
          in muscle physiology.
        meaning: UBERON:0008450
      RBC:
        description: A red blood cell. In mammals, mature erythrocytes are biconcave
          disks containing hemoglobin whose function is to transport oxygen.
        meaning: CL:0000232
      RNA:
        description: High molecular weight, linear polymers, composed of nucleotides
          containing ribose and linked by phosphodiester bonds; RNA is central to
          the synthesis of proteins.
        meaning: CHEBI:33697
      sacral spinal cord:
        description: A spinal cord segment that adjacent_to a sacral region.
        meaning: UBERON:0005843
      serum:
        description: The portion of blood plasma that excludes clotting factors.
        meaning: UBERON:0001977
      skin:
        description: The organ covering the body that consists of the dermis and epidermis.
        meaning: UBERON:0002097
      spleen:
        description: The organ that functions to filter blood and to store red corpuscles
          and platelets.
        meaning: UBERON:0002106
      stomach:
        description: An expanded region of the vertebrate alimentary tract that serves
          as a food storage compartment and digestive organ. A stomach is lined, in
          whole or in part by a glandular epithelium.
        meaning: UBERON:0000945
      systemic tissue:
        description: Tissue with cells that deposit non-polarized extracellular matrix
          including connective tissue fibers and ground substance.
        meaning: UBERON:0002384
      temporalis muscle:
        description: Pharyngeal arch 1 muscle that is innervated by the deep temporal
          branches of the trigeminal nerve and attaches to the wall of the braincase
          (including the cranial vault) and mandible.
        meaning: UBERON:0001598
      testicle:
        description: A typically paired male reproductive gland that produces sperm
          and that in most mammals is contained within the scrotum at sexual maturity.
        meaning: UBERON:0000473
      thoracic spinal cord:
        description: The thoracic nerves are the spinal nerves emerging from the thoracic
          vertebrae.
        meaning: UBERON:0003038
      thymus:
        description: Anatomical structure of largely lymphoid tissue that functions
          in cell-mediated immunity by being the site where T cells develop.
        meaning: UBERON:0002370
      thyroid:
        description: A two-lobed endocrine gland found in all vertebrates, located
          in front of and on either side of the trachea in humans, and producing various
          hormones, such as triiodothyronine and calcitonin.
        meaning: UBERON:0002046
      tissue:
        description: Multicellular anatomical structure that consists of many cells
          of one or a few types, arranged in an extracellular matrix such that their
          long-range organisation is at least partly a repetition of their short-range
          organisation.
        meaning: UBERON:0000479
      tissue-other: {}
      tongue:
        description: A fleshy movable process of the floor of the mouths of most vertebrates
          that bears sensory end organs and small glands and functions especially
          in taking and swallowing food and in humans as a speech organ.
        meaning: UBERON:0001723
      tonsil:
        description: Either of the two small almond-shaped masses of lymph tissue
          found on either side of the oropharynx.
        meaning: UBERON:0002372
      trachea:
        description: The trachea is the portion of the airway that attaches to the
          bronchi as it branches.
        meaning: UBERON:0003126
      umbilical cord:
        description: The connecting cord from the developing embryo to the placenta.
        meaning: UBERON:0002331
      ureter:
        description: Muscular duct that propels urine from the kidneys to the urinary
          bladder, or related organs.
        meaning: UBERON:0000056
      urinary bladder:
        description: Distensible musculomembranous organ situated in the anterior
          part of the pelvic cavity in which urine collects before excretion.
        meaning: UBERON:0001255
      urine:
        description: Excretion that is the output of a kidney.
        meaning: UBERON:0001088
      uterus:
        description: The female muscular organ of gestation in which the developing
          embryo or fetus is nourished until birth.
        meaning: UBERON:0000995
      vein:
        description: Any of the tubular branching vessels that carry blood from the
          capillaries toward the heart.
        meaning: UBERON:0001638
      vitreous: {}
      vitreous humor:
        description: A transparent, semigelatinous substance that fills the cavity
          behind the crystalline lens of the eye and in front of the retina.
        meaning: UBERON:0001797
      whole blood:
        description: An achromatic cell of the myeloid or lymphoid lineages capable
          of ameboid movement, found in blood or other tissue.
        meaning: CL:0000738
  tissue_source:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      whole blood:
        description: A fluid that is composed of blood plasma and erythrocytes.
        meaning: UBERON:0000178
      plasma:
        description: The liquid component of blood, in which erythrocytes are suspended.
        meaning: UBERON:0001969
      brain:
        description: The brain is the center of the nervous system in all vertebrate,
          and most invertebrate, animals. Some primitive animals such as jellyfish
          and starfish have a decentralized nervous system without a brain, while
          sponges lack any nervous system at all. In vertebrates, the brain is located
          in the head, protected by the skull and close to the primary sensory apparatus
          of vision, hearing, balance, taste, and smell.
        meaning: UBERON:0000955
      nasal swab:
        description: A specimen obtained using a cotton swab on a stick, passed up
          the nostril to obtain a sample of exudate and epithelial debris for microbiological
          or cellular examination.
        meaning: OBI:0000917
      serum:
        description: The portion of blood plasma that excludes clotting factors.
        meaning: UBERON:0001977
      other: {}
      unknown: {}
  traumatic_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      contusion:
        description: An injury to biological tissue in which the capillaries are damaged,
          allowing blood to seep into the surrounding tissue
        meaning: MP:0009275
      chronic traumatic encephalopathy:
        description: A tauopathy that is characterized by an abundance of hyperphosphorylated
          tau protein in neurons, astrocytes and cell processes around blood vessels
          and that is associated with repetitive head impacts or exposure to blast
          waves.
        meaning: DOID:0081291
      other (specify): {}
  vascular_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      acute infarct:
        description: Tissue necrosis in any area of the brain, including the cerebral
          hemispheres, the cerebellum, and the brain stem. Brain infarction is the
          result of a cascade of events initiated by inadequate blood flow through
          the brain that is followed by hypoxia and hypoglycemia in brain tissue.
          Damage may be temporary, permanent, selective or pan-necrosis.
        meaning: EFO:0004277
      chronic infarct:
        description: Tissue necrosis in any area of the brain, including the cerebral
          hemispheres, the cerebellum, and the brain stem. Brain infarction is the
          result of a cascade of events initiated by inadequate blood flow through
          the brain that is followed by hypoxia and hypoglycemia in brain tissue.
          Damage may be temporary, permanent, selective or pan-necrosis.
        meaning: EFO:0004277
      hemorrhage:
        description: Loss of blood from the vascular compartment to the exterior or
          into nonvascular body space as a result of rupture or severance of the blood
          vessels.
        meaning: MP:0001914
      other (specify): {}
