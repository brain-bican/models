  sex:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      male:
        description: A person who belongs to the sex that normally produces sperm.
          The term is used to indicate biological sex distinctions, cultural gender
          role distinctions, or both.
        meaning: PATO:0000384
      female:
        description: A person who belongs to the sex that normally produces ova. The
          term is used to indicate biological sex distinctions, or cultural gender
          role distinctions, or both.
        meaning: PATO:0000383
      intersex:
        description: A person (one of unisexual specimens) who is born with genitalia
          and/or secondary sexual characteristics of indeterminate sex, or which combine
          features of both sexes.
        meaning: PATO:0001340
      none of these describe me:
        description: 'Suggested Definition: A response indicating that an individual
          feels that no option listed is a good description for them.'
      prefer not to answer:
        description: A response indicating that an individual prefers or preferred
          not to answer.
      unknown:
        description: Not known, observed, recorded; or reported as unknown by the
          data contributor.
  sexual_orientation:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      bisexual:
        description: Historically, bisexual referred to attraction to persons of two
          gender identities, typically, but not always, defined as male and female.
          In modern use, it is usually used to refer to persons who are sexually and/or
          romantically attracted to persons with a gender or genders like theirs and
          those with a gender or genders unlike theirs. Note that sometimes bisexual
          may be used as a synonym of pansexual.
        meaning: GSSO:001590
      homosexual (gay/lesbian):
        description: A person who is attracted solely or primarily to others of the
          same gender (or sex, depending on precise usage), i.e. being either a male
          androphile or a female gynephile.
        meaning: GSSO:000398
      heterosexual:
        description: Sexually attracted to a person defined as being of the "opposite"
          sex (i.e. male attracted to female or female attracted to male); more broadly,
          attracted to a gender that is not one's own.
        meaning: GSSO:001592
      not reported:
        description: Not provided or available.
      other:
        description: A sexual orientation that is not present in this list.
      unknown:
        description: Not known, observed, recorded; or reported as unknown by the
          data contributor.
      asexual:
        description: A person who identifies as asexual.
        meaning: GSSO:000387
      prefer not to say: {}
      do not know: {}
