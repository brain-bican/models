  brain_tissue_weight_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      Fresh whole brain:
        description: A whole brain specimen that has not been frozen or fixed -- i.e.,
          a whole brain that has not yet been treated by a preserving method.
      Fixed whole brain:
        description: A whole brain specimen that has been treated for preservation
          (typically by formalin).
      Fresh hemibrain:
        description: A hemibrain specimen that has not been frozen or fixed -- i.e.,
          a whole brain that has not yet been treated by a preserving method.
      Fixed hemibrain:
        description: A hemibrain specimen that has been treated for preservation (typically
          by formalin).
