    permissible_values:
      formalin fixed:
        description: A tissue sample that has been fixed with formalin.
        meaning: NCIT:C200862
      4% paraformaldehyde fixed:
        description: A tissue sample that has been fixed with 4% paraformaldehyde.
      frozen:
        description: A tissue sample that has been frozen.
      other:
        description: A tissue sample that has been fixed by some other method.
      hemisphere not available: {}
  race:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      American Indian or Alaska Native:
        description: A person having origins in any of the original peoples of North
          and South America (including Central America) and who maintains tribal affiliation
          or community attachment.
        meaning: NCIT:C41259
      Asian:
        description: A person having origins in any of the original peoples of the
          Far East, Southeast Asia, or the Indian subcontinent, including for example,
          Cambodia, China, India, Japan, Korea, Malaysia, Pakistan, the Philippine
          Islands, Thailand, and Vietnam.
        meaning: NCIT:C41260
      Black or African American:
        description: A person having origins in any of the Black racial groups of
          Africa. Terms such as "Haitian" or "Negro" can be used in addition to "Black
          or African American".
        meaning: NCIT:C16352
      Native Hawaiian or Other Pacific Islander:
        description: A person having origins in any of the original peoples of Hawaii,
          Guam, Samoa, or other Pacific Islands.
        meaning: NCIT:C41219
      White:
        description: A person having origins in any of the original peoples of Europe,
          the Middle East, or North Africa.
        meaning: NCIT:C41261
      More than one race:
        description: Having ancestors of several or various races.
        meaning: NCIT:C67109
      Other Race:
        description: Individuals who do not necessarily identify with any particular
          race or others who do not wish to self select into a racial category(ies).
        meaning: NCIT:C104495
      Prefer not to Answer:
        description: A response indicating that an individual prefers or preferred
          not to answer.
      Unknown:
        description: Not known, observed, recorded; or reported as unknown by the
          data contributor.
  relative_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      biological mother:
        description: A female who contributes to the genetic makeup of her offspring
          from the fertilization of her ovum.
        meaning: NCIT:C96580
      biological father:
        description: A male who contributes to the genetic makeup of his offspring
          through the fertilization of an ovum by his sperm.
        meaning: NCIT:C96572
      full sibling:
        description: A sibling with whom one shares both parents.
        meaning: NCIT:C71390
      half sibling:
        description: A sibling with whom one shares a single parent.
        meaning: NCIT:C71391
      child:
        description: A first-generation, biological descendant of any age.
        meaning: NCIT:C42708
      maternal grandmother:
        description: A female relative who is the biological mother of the biological
          mother.
        meaning: NCIT:C96578
      paternal grandmother:
        description: A female relative who is the biological mother of the biological
          father.
        meaning: NCIT:C96584
      maternal grandfather:
        description: A male relative who is the biological father of the biological
          mother.
        meaning: NCIT:C96577
      paternal grandfather:
        description: A male relative who is the biological father of the biological
          father.
        meaning: NCIT:C96583
      maternal aunt:
        description: A female relative who is a sibling of the biological mother,
          and who both share a common ancestor.
        meaning: NCIT:C96575
      paternal aunt:
        description: A female relative who is a sibling of the biological father,
          and who both share a common ancestor.
        meaning: NCIT:C96581
      maternal uncle:
        description: A male relative who is a sibling of the biological mother, and
          who both share a common ancestor.
        meaning: NCIT:C96579
      paternal uncle:
        description: A male relative who is a sibling of the biological father, and
          who both share a common ancestor.
        meaning: NCIT:C96585
      maternal niece/nephew:
        description: A son or daughter of one's female biological sibling.
      paternal niece/nephew:
        description: A son or daughter of one's male biological sibling.
      maternal cousin:
        description: A relative who is the offspring of a sibling of the biological
          mother and thus sharing a common ancestor.
        meaning: NCIT:C96576
      paternal cousin:
        description: A relative who is the offspring of a sibling of the biological
          father and thus sharing a common ancestor.
        meaning: NCIT:C96582
      grandchild:
        description: A child of one's son or daughter.
        meaning: NCIT:C71397
      great-grandchild:
        description: A child of one's grandchild.
        meaning: NCIT:C165847
      other (specify): {}
