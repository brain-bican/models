name: Donor
description: The BICAN Donor Metadata schema specifies the metadata relating to donors
  in BICAN. These metadata reflect the metadata needed to accurately track donors
  and related entities from the brain banks through the specimen portal.
title: Donor Schema
id: https://w3id.org/brain-bicandonor
imports:
- bican_biolink
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  bican: https://identifiers.org/brain-bican/vocab/
  spdx: http://spdx.org/rdf/terms#
  schema: http://schema.org/
  ncbi: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi
  NIMP: http://example.org/NIMP/
default_prefix: bican
default_range: string
enums:
  aging_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      pTau:
        description: A microtubule-associated protein tau that includes at least one
          phosphorylated residue.
        meaning: PR:000026989
      pTDP-43:
        description: A protein that is a translation product of the human TARDBP gene
          or a 1:1 ortholog thereof.
        meaning: PR:000016057
      atherosclerosis:
        description: Build-up of fatty material and calcium deposition in the arterial
          wall resulting in partial or complete occlusion of the arterial lumen.
        meaning: MONDO:0005311
      arteriolosclerosis:
        description: The thickening of the wall of the small arteries and arterioles.
          It is caused by deposition of hyaline material in the wall or concentric
          smooth muscle wall hypertrophy. It results in lumen narrowing and tissue
          ischemia.
        meaning: MONDO:0006658
      Other (specify): {}
  artifact_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      'gross: brain removal/dissection':
        description: A planned process that separates and isolates the brain or tissues
          thereof for surgical purposes, or for the analysis of their structures.
      'microscopic: autolysis':
        description: A programmed cell death process observed in bacteria and filamentous
          fungi and leading to spontaneous death by lysis. Examples are lysis of the
          mother cell during sporulation of Bacillus subtilis and self-degradation
          of fungal cells in Aspergillus nidulans. Autolysis is also involved in bacterial
          biofilm formation. [GO]
        meaning: GO:0001896
      Other (specify): {}
