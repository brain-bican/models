  ethnicity:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      Hispanic or Latino:
        description: A person of Cuban, Mexican, Puerto Rican, South or Central American,
          or other Spanish culture or origin, regardless of race. The term, "Spanish
          origin" can be used in addition to "Hispanic or Latino".
      Not Hispanic or Latino:
        description: A person not of Cuban, Mexican, Puerto Rican, South or Central
          American, or other Spanish culture or origin, regardless of race.
      Prefer not to answer:
        description: A response indicating that an individual prefers or preferred
          not to answer.
      Unknown:
        description: Not known, observed, recorded; or reported as unknown by the
          data contributor.
      Not reported:
        description: Not provided or available.
  gender:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      male:
        description: The gender identity of male self-identified by the subject/participant.
        meaning: OMRSE:00000008
      female:
        description: The gender identity of female self-identified by the subject/participant.
        meaning: OMRSE:00000009
      transgender male:
        description: The gender identify of transgender male self-identified by the
          subject/participant.
        meaning: GSSO:000372
      transgender female:
        description: The gender identity of transgender female self-identified by
          the subject/participant.
        meaning: GSSO:000384
      non-binary:
        description: The gender identity of non-binary self-identified by the subject/participant.
        meaning: GSSO:000395
      gender fluid:
        description: The gender identity of gender fluid self-identified by the subject/participant.
        meaning: GSSO:000406
      other, specify:
        description: A gender identity of a type not included in this list.
      unknown:
        description: Not known, observed, recorded; or reported as unknown by the
          data contributor.
      not reported:
        description: Gender identity not reported.
  handedness:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      left:
        description: Handedness where the organism preferentially uses the left hand
          or foot for tasks requiring the use of a single hand or foot or a dominant
          hand or foot
        meaning: PATO:0002202
      right:
        description: Handedness where the organism preferentially uses the right hand
          or foot for tasks requiring the use of a single hand or foot or a dominant
          hand or foot.
        meaning: PATO:0002203
      either:
        description: Handedness where the organism exhibits no overall dominance in
          the use of right or left hand or foot in the performance of tasks that require
          one hand or foot or a dominant hand or foot.
        meaning: PATO:0002204
  hemisphere:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      left:
        description: A cerebral hemisphere that is in the left side of a brain.
      right:
        description: A cerebral hemisphere that is in the right side of a brain.
      both:
        description: Part of the telencephalon consisting of both of the two smooth,
          elongated halves of the cerebrum.
      unknown: {}
  income_range:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      Under $15000:
        description: Annual income under 15000 USD
      $15000 to $24999:
        description: Annual income between 15000 and 24999 USD
      $25000 to $34999:
        description: Annual income between 25000 and 34999 USD
      $35000 to $49999:
        description: Annual income between 35000 and 49999 USD
      $50000 to $74999:
        description: Annual income between 50000 and 74999 USD
      $75000 to $99999:
        description: Annual income between 75000 and 99999 USD
      $100000 and over:
        description: Annual income greater than 100000 USD
      Refused:
        description: Annual income disclosure refused.
      Unknown:
        description: Annual income unknown.
  informant_relationship:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      child:
        description: A person who is either the progeny of the subject or the adoptive
          child of the subject.
      friend/neighbor:
        description: Either one of a friend of the subject or a person who lives near
          the subject.
      parent:
        description: A caretaker and/or immediate progenitor of a child.
        meaning: GSSO:001953
      professional caregiver:
        description: A person who bears the caretaker role for the subject.
      themself:
        description: A person who is identical to the subject, i.e., the subject themselves.
      sibling:
        description: A person who shares a parent.
        meaning: GSSO:001955
      spouse/partner:
        description: A partner in marriage.
        meaning: GSSO:001968
      teammate:
        description: A person who is a member of a team whose membership includes
          the subject.
      other relative (specify): {}
      other (specify): {}
