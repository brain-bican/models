  condition_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      Alzheimers disease:
        description: A progressive, neurodegenerative disease characterized by loss
          of function and death of nerve cells in several areas of the brain leading
          to loss of cognitive function such as memory and language.
        meaning: MONDO:0004975
      amyotrophic lateral sclerosis (ALS):
        description: Amyotrophic lateral sclerosis (ALS) is a neurodegenerative disease
          characterized by progressive muscular paralysis reflecting degeneration
          of motor neurons in the primary motor cortex, corticospinal tracts, brainstem
          and spinal cord.
        meaning: MONDO:0004976
      ataxia:
        description: "A central nervous system disease that consists of gait impairment,\
          \ unclear (\u201Cscanning\u201D) speech, visual blurring due to nystagmus,\
          \ hand incoordination, and tremor with movement."
        meaning: MONDO:0100308
      autism:
        description: Persistent deficits in social interaction and communication and
          interaction as well as a markedly restricted repertoire of activity and
          interest as well as repetitive patterns of behavior.
        meaning: MONDO:0005260
      bi-polar disorder:
        description: A disorder of the brain that causes unusual shifts in mood, energy,
          activity levels and the ability to carry out day-to-day tasks. Often these
          moods range and shift from periods of elation and energized behavior to
          those of hopelessness and depression.
        meaning: MONDO:0004985
      brain aneurysm:
        description: A congenital or acquired aneurysm within the cranium.
        meaning: MONDO:0005291
      cancer:
        description: A tumor composed of atypical neoplastic, often pleomorphic cells
          that invade other tissues. Malignant neoplasms often metastasize to distant
          anatomic sites and may recur after excision. The most common malignant neoplasms
          are carcinomas (adenocarcinomas or squamous cell carcinomas), Hodgkin and
          non-Hodgkin lymphomas, leukemias, melanomas, and sarcomas.
        meaning: MONDO:0004992
      dementia:
        description: Loss of intellectual abilities interfering with an individual's
          social and occupational functions. Causes include Alzheimer's disease, brain
          injuries, brain tumors, and vascular disorders.
        meaning: MONDO:0001627
      depression:
        description: A melancholy feeling of sadness and despair.
        meaning: MONDO:0002050
      diabetes mellitus:
        description: A metabolic disorder characterized by abnormally high blood sugar
          levels due to diminished production of insulin or insulin resistance/desensitization.
        meaning: MONDO:0005015
      dystonia:
        description: A movement disorder characterized by sustained or intermittent
          muscle contractions, resulting in abnormal movements and/or postures.
        meaning: MONDO:0003441
      epilepsy:
        description: A brain disorder characterized by episodes of abnormally increased
          neuronal discharge resulting in transient episodes of sensory or motor neurological
          dysfunction, or psychic dysfunction. These episodes may or may not be associated
          with loss of consciousness or convulsions.
        meaning: MONDO:0005027
      heart disease:
        description: A disease involving the heart and/or pericardium.
        meaning: MONDO:0005267
      hypertension:
        description: Persistently high systemic arterial blood pressure. Based on
          multiple readings (blood pressure determination), hypertension is currently
          defined as when systolic pressure is consistently greater than 140 mm Hg
          or when diastolic pressure is consistently 90 mm Hg or more.
        meaning: MONDO:0005044
      memory loss:
        description: Systematic and extensive loss of memory caused by organic or
          psychological factors. The loss may be temporary or permanent, and may involve
          old or recent memories.
        meaning: MONDO:0001152
      migraines:
        description: A common, severe type of vascular headache often associated with
          increased sympathetic activity, resulting in nausea, vomiting, and light
          sensitivity.
        meaning: MONDO:0005277
      multiple sclerosis:
        description: A progressive autoimmune disorder affecting the central nervous
          system resulting in demyelination. Patients develop physical and cognitive
          impairments that correspond with the affected nerve fibers.
        meaning: MONDO:0005301
      muscle disease:
        description: A disease involving the muscle tissue.
        meaning: MONDO:0003939
      Parkinson's disease:
        description: A progressive degenerative disorder of the central nervous system
          characterized by loss of dopamine producing neurons in the substantia nigra
          and the presence of Lewy bodies in the substantia nigra and locus coeruleus.
          Signs and symptoms include tremor which is most pronounced during rest,
          muscle rigidity, slowing of the voluntary movements, a tendency to fall
          back, and a mask-like facial expression.
        meaning: MONDO:0005180
      schizophrenia:
        description: A major psychotic disorder characterized by abnormalities in
          the perception or expression of reality. It affects the cognitive and psychomotor
          functions. Common clinical signs and symptoms include delusions, hallucinations,
          disorganized thinking, and retreat from reality.
        meaning: MONDO:0005090
      stroke:
        description: A sudden loss of neurological function secondary to hemorrhage
          or ischemia in the brain parenchyma due to a vascular event. Stroke includes
          two main types, hemorrhagic and ischemic. Both types of stroke can cause
          acute seizures at the time of the acute event, as well as epilepsy as a
          long-term complication. In the elderly, cerebrovascular disease and stroke
          are the most common cause of acute seizures and epilepsy.
        meaning: MONDO:0005098
      suicide or suicide attempt:
        description: Any behaviour related to suicide, including suicide ideation
          and self-harm
        meaning: EFO:0007623
      tourette syndrome:
        description: A neurologic disorder caused by defective metabolism of the neurotransmitters
          in the brain. It is characterized by repeated involuntary movements (motor
          tics) and uncontrollable vocal sounds (vocal tics). The symptoms are usually
          manifested before the age of eighteen.
        meaning: MONDO:0007661
      other (specify): {}
  confidence_level:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      confirmed diagnosis:
        description: 'Sufficient evidence exists to: 1) make a clinical diagnosis
          based on medical history and neuropathological exam or genetic data or 2)
          make a clinical diagnosis by the consensus of expert clinicians or 3) confirm
          the absence of any brain-related diagnoses (i.e. Unaffected Control)'
      investigator impression:
        description: Diagnosis is based on the clinical impressions of the clinician
          reviewing the available information but that information is insufficient
          to render a confirmed diagnosis
      insufficient data:
        description: The available information is insufficient to form a reasonable
          impression of or to exclude any brain-related diagnoses
