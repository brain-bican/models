  manner_of_death:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      not deceased: {}
      accidental:
        description: A manner of death in which death is caused by inadvertent chance
          happening(s).
      homicide:
        description: A manner of death in which death is caused by a person's intentional
          action to kill or harm another.
      suicide:
        description: A manner of death in which death is caused by self-inflicted
          injurty with evidence of intent to die.
      natural:
        description: A manner of death in which death is caused solely by disease
          or natural process.
      manner of death undetermined:
        description: A manner of death where little information is known about the
          circumstances surrounding death or where information equally supports and/or
          conflicts with more than one manner of death.
      unknown if subject is deceased or not: {}
  marital_status:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      never married:
        description: A person who has never been married or whose only marriages have
          been annulled.
        meaning: NCIT:C51774
      married:
        description: A person currently joined in matrimony. Classify common law marriage
          as married. Includes married couples living together and not living together.
        meaning: NCIT:C51773
      domestic partnership:
        description: A person who is a member of an unmarried couple, including same
          sex couples, living together in longstanding relationships, that are registered
          or unregistered.
        meaning: NCIT:C53262
      divorced:
        description: A person whose marriage has been legally dissolved and has not
          remarried.
        meaning: NCIT:C51776
      separated:
        description: A person living apart from his/her spouse by legal arrangement.
        meaning: NCIT:C156541
      widowed:
        description: A person who is no longer married because of the death of his/her
          spouse and who has not remarried.
        meaning: NCIT:C51775
  neoplastic_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      intrinsic:
        description: A disposition inhering in a tumour by virtue of the bearer's
          disposition not to invade surrounding tissues.
        meaning: PATO:0002132
      metastasis:
        description: A disposition inhering in a tumour by virtue of the bearer's
          disposition to spread and invade distant tissues.
        meaning: PATO:0002098
      other (specify):
        description: A structural quality which is held by a bearer when the latter's
          disposition the presence of abnormally proliferating masses of cells.
        meaning: PATO:0002011
  neurodegenerative_type:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      beta amyloid:
        description: A peptide of 36-43 amino acids that is processed from the amyloid
          precursor protein. Appears to be the main constituent of amyloid plaques
          (deposits found in the brains of Alzheimer's disease patients).
        meaning: CHEBI:64645
      pTau:
        description: A microtubule-associated protein tau that includes at least one
          phosphorylated residue.
        meaning: PR:000026989
      pTDP-43:
        description: A protein that is a translation product of the human TARDBP gene
          or a 1:1 ortholog thereof.
        meaning: PR:000016057
      alpha-synuclein:
        description: A protein that is a translation product of the human SNCA gene
          or a 1:1 ortholog thereof.
        meaning: PR:000015322
      Other (specify): {}
  perinatal_event:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      subdural hemorrhage:
        description: Bleeding into the subdural space, the potential space between
          the dura and arachnoid mater of the meninges around the brain.
        meaning: MP:0031117
      subarachnoid hemorrhage:
        description: Intracranial hemorrhage into the subarachnoid space.
        meaning: MONDO:0005099
      intraparenchymal hemorrhage:
        description: Bleeding into the intraparenchymal space.
      intraventricular hemorrhage:
        description: Bleeding into the brain ventricles.
        meaning: MP:0001917
      hypoxia:
        description: Reduced oxygenation of body tissues resulting in the decreased
          pressure of this component of body gases; commonly due to hypoxemia.
        meaning: MP:0005039
      other (specify): {}
      none: {}
  postmortem_MRI:
    from_schema: https://w3id.org/brain-bicandonor
    permissible_values:
      cadaveric:
        description: A piece of tissue or a sample that is taken from a dead body
          (cadaver).
      fresh ex vivo:
        description: A piece of tissue or a sample that is taken from a living organism
          and not fixed.
      fixed ex vivo:
        description: A piece of tissue or a sample that is taken from a living organism
          and fixed.
