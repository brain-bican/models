  Abbreviation:
    description: Maps an abbreviation string to its decoded meaning. Optionally the
      abbreviation can be linked to one or more entities it denotes.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this abbreviation entry.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
    attributes:
      term:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.tokens_<level> (data only)
          note:
            tag: note
            value: 'Pipe-separated name tokens, e.g. ''STRv|D1 MSN'', ''CN|LGE|GABA''.
              Present in all 3 files. DERIVATION: split the cell value on ''|'' and
              mint one Abbreviation per distinct token; the token is the term. The
              expansion (meaning) is not in the file -- see Abbreviation.meaning.'
          source:
            tag: source
            value: bke
        description: An abbreviation term as it appears in a cell type or cell set
          name.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      meaning:
        annotations:
          note:
            tag: note
            value: No AIT source anywhere -- tokens give the term only, never its
              expansion. Fill from a BKE-side lookup.
          source:
            tag: source
            value: bke
        description: The decoded meaning of the abbreviation term.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
