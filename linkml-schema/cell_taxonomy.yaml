name: CellTaxonomy
title: Cell Taxonomy Schema
id: https://w3id.org/brain-bican/cell-taxonomy
imports:
- bican_biolink
- bican_prov
- bican_core
- genome_annotation
- anatomical_structure
- linkml:types
prefixes:
  bican: https://identifiers.org/brain-bican/vocab/
  linkml: https://w3id.org/linkml/
default_prefix: bican
default_range: string
subsets:
  data:
    description: AIT assigned label to tag attributes representing data.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  assigned_metadata:
    description: AIT assigned label to tag attributes representing assigned metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  annotations:
    description: AIT assigned label to tag attributes representing annotations.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  tooling:
    description: AIT assigned label to tag attributes representing tooling.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  analysis:
    description: AIT assigned label to tag attributes representing analysis.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  X:
    description: Location within anndata object that stores data.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  raw:
    description: Location within anndata object that stores data.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  obs:
    description: Location within anndata object that stores cell metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  obsm:
    description: Location within anndata object that stores cell-shaped matrices.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  var:
    description: Location within anndata object that stores gene metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  varm:
    description: Location within anndata object that stores gene-shaped metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  uns:
    description: Location within anndata object that stores header and everything
      else.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
enums:
  SuspensionType:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    permissible_values:
      cell: {}
      nucleus: {}
      na: {}
  CellTypeSetType:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    permissible_values:
      taxonomic_level:
        description: Denotes CellTypeSet is at Taxonomic level.
      neighborhood:
        description: Denotes CellTypeSet is at Neighborhood level.
  ExpressionMatrixType:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    permissible_values:
      normalized:
        description: Matrix contains normalized expression values.
      raw_count:
        description: Matrix contains raw counts.
  AbbreviationEntityType:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    permissible_values:
      cell_type:
        description: Abbreviation denotes a Cell Type entity.
      gene:
        description: Abbreviation denotes a Gene entity.
      anatomical:
        description: Abbreviation denotes an Anatomical Structure entity.
slots:
  accession_id:
    annotations:
      source:
        tag: source
        value: bke
    description: A provider-assigned accession identifier for a given entity.
    in_subset:
    - uns
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    range: string
  order:
    annotations:
      ait_location:
        tag: ait_location
        value: uns.cluster_info.display_order_<level> (data only)
      source:
        tag: source
        value: bke
    description: The priority or display order of an entity among all other entities
      of the same type.
    in_subset:
    - uns
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    range: integer
  has_parent:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  part_of_set:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  has_abbreviation:
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
classes:
  Cell:
    description: A single cell observation in the taxonomy; corresponds to one row
      in the obs DataFrame of the h5ad file.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.index
          note:
            tag: note
            value: 'explain: barcode_Cell_sample+barcode'
          source:
            tag: source
            value: ait
        description: Unique identifier for each individual cell.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
    attributes:
      cluster_id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.cluster_id
          note:
            tag: note
            value: "String value; one per annotation level column; for object modeling\
              \ derive via Cell.part_of_cluster \u2192 Cluster.annotated_as"
          source:
            tag: source
            value: ait
        description: Human-readable cluster label for the cluster assigned to this
          cell at a given annotation level.
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      load_id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.load_id
          note:
            tag: note
            value: it should be pointing to BarcodedCellSample, and the slot name
              should also change; nhash id should be used
          source:
            tag: source
            value: ait
        description: Identifier for the sequencing library from which molecular measurements
          were derived.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      assay:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.assay
          source:
            tag: source
            value: ait
        description: Human-readable sequencing modality (e.g. 10x 3' v3).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      assay_ontology_term_id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.assay_ontology_term_id
          source:
            tag: source
            value: ait
        description: EFO ontology term for assay (e.g. EFO:0009922 for 10x 3' v3).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      anatomical_region:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.anatomical_region
          source:
            tag: source
            value: ait
        description: Human-readable name for the anatomical region from which the
          cell was collected.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      anatomical_region_ontology_term_id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.anatomical_region_ontology_term_id
          source:
            tag: source
            value: ait
        description: UBERON ontology term for anatomical region (e.g. UBERON:0000955
          for brain).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      brain_region_ontology_term_id:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.brain_region_ontology_term_id
          source:
            tag: source
            value: ait
        description: Brain atlas region ID from DHBA/HBA/MBA for the anatomical region.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      suspension_type:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.suspension_type
          source:
            tag: source
            value: ait
        description: Whether the measurement was performed on intact cells, nuclei,
          or is not applicable.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: SuspensionType
      is_primary_data:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.is_primary_data
          source:
            tag: source
            value: ait
        description: True if this is the canonical instance of this cellular observation;
          False for reanalysis or secondary views.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: boolean
      part_of_cluster:
        description: The cluster to which this cell has been assigned by the clustering
          algorithm.
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: Cluster
  CellTypeSet:
    description: A named annotation level in the taxonomy hierarchy (e.g. Class, Subclass)
      grouping cell type taxons. May represent a taxonomic level or a neighborhood.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - name
    - order
    - has_parent
    - has_abbreviation
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (key)
          source:
            tag: source
            value: both
        description: Unique identifier for this annotation level.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      name:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (key) / obs (column name)
          source:
            tag: source
            value: both
        description: Name of this annotation level used as column header in obs (e.g.
          Class, Subclass).
        in_subset:
        - obs
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      order:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (value)
          source:
            tag: source
            value: both
        description: Integer rank of this annotation level in the hierarchy; lower
          values are broader types.
        in_subset:
        - uns
        - annotations
        range: integer
      has_parent:
        description: The next broader annotation level in the taxonomy hierarchy (e.g.
          Subclass has_parent Class).
        in_subset:
        - uns
        - annotations
        range: CellTypeSet
      has_abbreviation:
        description: One of potentially many abbreviations that are part of the cell
          type set name.
        in_subset:
        - uns
        - annotations
        range: Abbreviation
        multivalued: true
    attributes:
      cell_type_set_type:
        annotations:
          source:
            tag: source
            value: bke
        description: A tag denoting whether this grouping represents a taxonomic level
          or neighborhood.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: CellTypeSetType
      has_abbreviation:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.tokens_<level> (data only)
          note:
            tag: note
            value: New; from BKE CellTypeSet.has_abbreviation
          source:
            tag: source
            value: bke
        description: One of potentially many abbreviations that are part of the cell
          type set name.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: Abbreviation
      part_of_taxonomy:
        description: The taxonomy for which this annotation level is defined.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: CellTypeTaxonomy
  CellTypeTaxon:
    description: A node in the cell type taxonomy representing a unit of cell type
      classification at a specific annotation level. Taxons may be organized into
      a hierarchy and grouped into neighborhoods.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - name
    - accession_id
    - order
    - has_parent
    - part_of_set
    - has_abbreviation
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this cell type taxon.
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      name:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.<annotation_level>
          source:
            tag: source
            value: both
        description: Human-readable label for this cell type taxon at the given annotation
          level (e.g. Glutamatergic).
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      accession_id:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.accession_<level> (data only)
          source:
            tag: source
            value: bke
        description: Stable cross-version identifier for this cell type taxon (e.g.
          CS20230722_CLAS_11).
        in_subset:
        - uns
        - annotations
        range: string
      order:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.display_order_<level> (data only)
          source:
            tag: source
            value: bke
        description: The priority or display order of this taxon among all taxons
          in the taxonomy.
        in_subset:
        - uns
        - annotations
        range: integer
      has_parent:
        description: Reference to the parent taxon at the next broader annotation
          level.
        in_subset:
        - uns
        - annotations
        range: CellTypeTaxon
      part_of_set:
        description: The annotation level (CellTypeSet) for which this taxon is a
          member.
        in_subset:
        - uns
        - annotations
        range: CellTypeSet
      has_abbreviation:
        description: One of potentially many abbreviations that are part of the cell
          type taxon name.
        in_subset:
        - uns
        - annotations
        range: Abbreviation
        multivalued: true
    attributes:
      cell_type_ontology_term:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.CL:ID_<level> (data only)
          note:
            tag: note
            value: 'DECISION NEEDED. AIT_schema.csv spells this ''cell_type_ontology_term''
              (no _id); README uses ''_id'' -- alias records the README form. The
              documented obs.cell_type_ontology_term exists but is uniformly CL:0000003
              across all 388 Macaque clusters, i.e. carries no information; real per-taxon
              grounding is the data-only CL:ID_<level> (29 distinct at Group, 7 at
              Class). Choose: (a) one taxon-level slot pointing at CL:ID_<level> as
              here, or (b) add a separate Cell-level slot for the documented obs field.'
          source:
            tag: source
            value: ait
        description: CL ontology term for this cell type; use CL:0000003 for native
          cell if unknown.
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        aliases:
        - cell_type_ontology_term_id
        range: string
      number_of_cells:
        annotations:
          ait_location:
            tag: ait_location
            value: '(derived: count obs rows grouped by obs.<annotation_level>)'
          note:
            tag: note
            value: 'NOT STORED. No cell-count column exists in uns.cluster_info in
              any of the 3 species. Compute from obs: group the 548,281 obs rows by
              the level column (Neighborhood/Class/Subclass/Group) and count. Requires
              reading obs, so it is NOT available from cluster_info alone -- a parser
              run with load_obs=False cannot populate this.'
          source:
            tag: source
            value: bke
        description: The aggregated number of cells that defines this cell type taxon.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: integer
      has_abbreviation:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info.tokens_<level> (data only)
          note:
            tag: note
            value: New; from BKE CellTypeTaxon.has_abbreviation
          source:
            tag: source
            value: bke
        description: One of potentially many abbreviations that are part of the cell
          type taxon name.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: Abbreviation
      curated_markers_to_primates:
        description: Marker genes in the primate species that are related to the respective
          cell type.
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: GeneAnnotation
        multivalued: true
      curated_markers_to_mouse:
        description: Marker genes in the mouse species that are related to the respective
          cell type.
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: GeneAnnotation
        multivalued: true
  CellTypeTaxonomy:
    description: A systematic classification of cell types and their hierarchical
      relationships in the mammalian brain, including annotation levels and their
      corresponding cell type nodes.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - accession_id
    - content_url
    - was_derived_from
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this taxonomy.
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      accession_id:
        annotations:
          source:
            tag: source
            value: bke
        description: Provider-assigned accession identifier for this taxonomy (e.g.
          CCN20230722).
        range: string
      content_url:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.dataset_purl
          note:
            tag: note
            value: Value in all 3 HMBA files is the literal string 'BICAN_s3_bucket',
              which is not a URI -- a uri-typed slot will fail validation.
          source:
            tag: source
            value: both
        description: Permanent URL to molecular data if the expression matrix is not
          embedded in the file.
        in_subset:
        - uns
        - data
        from_schema: https://identifiers.org/brain-bican/bican-core-schema
        aliases:
        - dataset_purl
        range: uri
      was_derived_from:
        description: One or more cluster sets from which this taxonomy was derived.
        range: ClusterSet
        multivalued: true
    attributes:
      title:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.title
          note:
            tag: note
            value: BKE equivalent is name (e.g. AIT21.0)
          source:
            tag: source
            value: both
        description: Description differentiating this taxonomy from others in the
          same collection; should be unique within a collection.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        aliases:
        - name
        range: string
      schema_version:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.schema_version
          source:
            tag: source
            value: ait
        description: Version of the AIT schema used to produce this file (e.g. 1.0.0).
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      batch_condition:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.batch_condition
          note:
            tag: note
            value: Multivalued list of obs column names; no BKE equivalent
          source:
            tag: source
            value: ait
        description: Cell metadata key(s) in obs that define batches for normalization
          or integration.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      dendrogram:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.dendrogram
          note:
            tag: note
            value: RECOMMENDED in AIT_schema.csv but absent from all 3 HMBA files.
          source:
            tag: source
            value: ait
        description: JSON-formatted hierarchical clustering dendrogram encoding the
          taxonomy hierarchy.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      hierarchy:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy
          note:
            tag: note
            value: Stored as dict; overlaps with CellTypeSet.order; retained for tooling
              convenience
          source:
            tag: source
            value: ait
        description: Ordered mapping of annotation level names to integer ranks; lower
          rank means broader type.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      mode:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.mode
          note:
            tag: note
            value: 'Computed for analysis; Jeremy: folks can ignore'
          source:
            tag: source
            value: ait
        description: Active taxonomy mode controlling which subset of cells and analysis
          components to use.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      filter:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.filter
          note:
            tag: note
            value: 'Multivalued; computed for analysis; Jeremy: folks can ignore'
          source:
            tag: source
            value: ait
        description: Per-mode boolean flags indicating cells to exclude (True means
          exclude).
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: boolean
      cluster_algorithm:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_algorithm
          note:
            tag: note
            value: Stored as dict
          source:
            tag: source
            value: ait
        description: Full description of clustering algorithm and parameters used
          to produce cluster assignments.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      cluster_info:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cluster_info
          note:
            tag: note
            value: 'Stored as dict; Jeremy: effectively the obs table saved per cluster;
              what people call the "Google Sheet" of cell type annotations'
          source:
            tag: source
            value: ait
        description: Summary table of cluster-level metadata including cluster sizes
          and representative metadata.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      default_embedding:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.default_embedding
          note:
            tag: note
            value: String key matching Embedding.embedding_key of the default embedding
              to display
          source:
            tag: source
            value: ait
        description: Key in obsm of the embedding to display by default; must match
          an X_-prefixed entry.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      cellannotation_schema:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.cellannotation_schema
          note:
            tag: note
            value: RECOMMENDED in AIT_schema.csv but absent from all 3 HMBA files.
          source:
            tag: source
            value: ait
        description: CAS annotation schema stored as JSON encoding labelset and annotation
          metadata.
        in_subset:
        - uns
        - tooling
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      quality_control_markers:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.qualty_control_markers
          note:
            tag: note
            value: AIT_schema.csv misspells the key as 'qualty_control_markers' (both
              shipped CSVs); README spells it correctly. Location follows the CSV
              because that is what scrattch uses. Absent from all 3 HMBA files. REPORTED
              UPSTREAM -- revisit if fixed.
          source:
            tag: source
            value: ait
        description: Marker gene expression data for patchseq quality control analysis.
        in_subset:
        - uns
        - analysis
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        aliases:
        - quality_control_markers
        range: string
      reference_genome:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.reference_genome
          note:
            tag: note
            value: 'DECISION NEEDED: class placement. Documented in AIT_schema.csv
              (uns, RECOMMENDED) and present in all 3 files, but value is ''GRCh38''
              for Macaque and Marmoset too -- consistent with a cross-species consensus
              taxonomy; confirm with AIT. May belong on a GenomeAnnotation class instead
              (unresolved in tmp_ait/open_questions.md).'
          source:
            tag: source
            value: ait
        description: Reference genome assembly used to align the molecular measurements.
        in_subset:
        - uns
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      gene_annotation_version:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.gene_annotation_version
          note:
            tag: note
            value: 'DECISION NEEDED: class placement (see reference_genome). Present
              in all 3 files but the value is an empty string in every one.'
          source:
            tag: source
            value: ait
        description: Genome annotation version used during alignment.
        in_subset:
        - uns
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      has_embedding:
        description: One or more dimensionality reductions associated with this taxonomy.
        in_subset:
        - obsm
        - analysis
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: Embedding
        multivalued: true
      has_expression_matrix:
        description: One or more cell-by-gene matrices associated with this taxonomy
          (normalized and/or raw counts).
        in_subset:
        - X
        - raw
        - data
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: ExpressionMatrix
        multivalued: true
  ClusterSet:
    description: The set of clusters produced by a single clustering run. A CellTypeTaxonomy
      is derived from one or more ClusterSets.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - name
    - was_derived_from
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this cluster set.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      name:
        annotations:
          source:
            tag: source
            value: bke
        description: Human-readable name for this cluster set (e.g. the name of the
          clustering run).
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      was_derived_from:
        range: ExpressionMatrix
        multivalued: true
  Cluster:
    description: A single cluster resulting from a clustering algorithm; groups cells
      with similar molecular profiles. Corresponds to one row in cluster_info and
      one distinct value of cluster_id in obs.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - name
    - part_of_set
    - has_parent
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this cluster.
        in_subset:
        - obs
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      name:
        annotations:
          ait_location:
            tag: ait_location
            value: obs.cluster_id
          source:
            tag: source
            value: both
        description: Human-readable label for this cluster; corresponds to cluster_id
          values in obs.
        in_subset:
        - obs
        - uns
        - annotations
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      part_of_set:
        description: The cluster set to which this cluster belongs.
        in_subset:
        - uns
        - annotations
        range: ClusterSet
      has_parent:
        in_subset:
        - obs
        - uns
        - annotations
        range: CellTypeTaxon
        multivalued: true
    attributes:
      number_of_observations:
        annotations:
          ait_location:
            tag: ait_location
            value: '(derived: count obs rows grouped by obs.cluster_id)'
          note:
            tag: note
            value: 'NOT STORED. The previously claimed cluster_info.n_cells does not
              exist in any species. Compute from obs by grouping on cluster_id. Same
              caveat as number_of_cells: needs obs, not available from cluster_info
              alone.'
          source:
            tag: source
            value: bke
        description: Number of cells assigned to this cluster.
        in_subset:
        - uns
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: integer
  ExpressionMatrix:
    description: A cell-by-gene matrix of molecular measurements. Each row represents
      a cell and each column represents a gene. May be normalized (X) or raw counts
      (raw.X).
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    aliases:
    - X
    - raw.X
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - content_url
    slot_usage:
      id:
        annotations:
          ait_location:
            tag: ait_location
            value: (synthesized)
          note:
            tag: note
            value: Minted by the pipeline; no AIT source. ID strategy NOT YET DECIDED
              -- bkbit's existing taxonomy2jsonld uses a deterministic hash of the
              object's attributes (generate_object_id), which keeps ids stable across
              re-runs. Whatever is chosen must be deterministic, or re-ingesting the
              same file produces different ids.
          source:
            tag: source
            value: bke
        description: Unique identifier for this expression matrix.
        from_schema: https://w3id.org/biolink/bican-biolink-schema
        range: string
      content_url:
        annotations:
          ait_location:
            tag: ait_location
            value: uns.dataset_purl
          note:
            tag: note
            value: Corresponds to AIT dataset_purl; BKE ExpressionMatrix.content_url
          source:
            tag: source
            value: both
        description: URL to the matrix file if the matrix is not embedded directly
          in the h5ad file.
        in_subset:
        - uns
        - data
        from_schema: https://identifiers.org/brain-bican/bican-core-schema
        aliases:
        - dataset_purl
        range: uri
    attributes:
      matrix_type:
        annotations:
          ait_location:
            tag: ait_location
            value: '(derived: normalized if read from X, raw_count if read from raw.X)'
          note:
            tag: note
            value: 'NOT STORED as a value. AIT encodes it structurally: X holds normalized
              expression, raw.X holds counts. The enum value follows from which group
              the matrix was read from. In all 3 HMBA files X is present (csr_matrix)
              and raw exists.'
          source:
            tag: source
            value: ait
        description: Whether this matrix contains normalized expression values or
          raw counts.
        in_subset:
        - X
        - raw
        - data
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: ExpressionMatrixType
      has_variable:
        description: One of the genes (variables) measured across all cells in this
          matrix; corresponds to a column in var.
        in_subset:
        - var
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: GeneAnnotation
        multivalued: true
  Embedding:
    description: "A dimensionality reduction of the cell-by-gene matrix (e.g. UMAP,\
